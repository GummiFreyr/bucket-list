<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self' https://textdb.online; manifest-src 'self'; worker-src 'self'; font-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#f2f2f7">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Bucket List">
<meta name="format-detection" content="telephone=no">
<title>Our Bucket List</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/favicon-32.png">
<style>
:root{
  --bg:#f2f2f7; --card:#fff; --fill:#f2f2f7; --fill2:#e9e9ee; --line:rgba(60,60,67,.12);
  --txt:#1c1c1e; --mut:#8e8e93; --dim:#c7c7cc; --pink:#ff375f; --pink2:#ff6b8a; --soft:#fff0f3; --green:#34c759;
  --shadow:0 1px 2px rgba(0,0,0,.04),0 4px 16px rgba(0,0,0,.05);
  --spring:cubic-bezier(.34,1.56,.64,1); --ease:cubic-bezier(.32,.72,0,1);
  --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
}
[hidden]{display:none!important}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none;scrollbar-width:none}
::-webkit-scrollbar{display:none;width:0;height:0}
input,textarea{-webkit-user-select:text;user-select:text}
html,body{margin:0;height:100%;overflow:hidden;touch-action:manipulation;color:var(--txt);background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display",system-ui,"Helvetica Neue",sans-serif;-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%}
body{position:fixed;inset:0;overscroll-behavior:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;cursor:pointer}
.tap{transition:transform .35s var(--spring)}
.tap:active{transform:scale(.96);transition:transform .12s ease}
svg.ic{width:1em;height:1em;display:block;flex:none;pointer-events:none}

/* layout */
.scroller{position:absolute;inset:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:calc(var(--safe-t) + 12px) 0 calc(var(--safe-b) + 110px)}
.wrap{max-width:560px;margin:0 auto;padding:0 18px}
.view{display:none}.view.on{display:block;animation:viewIn .45s var(--ease)}
@keyframes viewIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.top{display:flex;align-items:flex-end;justify-content:space-between;margin:6px 2px 4px}
.top h1{font-size:34px;font-weight:700;letter-spacing:-.8px;margin:0;line-height:1.1}
.top .sub{color:var(--mut);font-size:15px;margin:6px 2px 18px}
.top .sub b{color:var(--pink);font-weight:600}
.sync{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--mut);background:var(--card);border-radius:20px;padding:6px 10px;box-shadow:var(--shadow);margin-bottom:6px;transition:opacity .3s}
.sync i{width:7px;height:7px;border-radius:50%;background:var(--green);display:block;transition:background .3s}
.sync.busy i{background:#ffcc00;animation:pulse 1s infinite}
.sync.off i{background:var(--dim)}
@keyframes pulse{50%{opacity:.3}}

/* progress card */
.hero{background:linear-gradient(135deg,#ff5a7d,#ff8fa8);color:#fff;border-radius:24px;padding:18px 20px;display:flex;align-items:center;gap:16px;box-shadow:0 8px 24px rgba(255,55,95,.25);margin-bottom:22px}
.hero .ring{width:64px;height:64px;flex:none;position:relative}
.hero .ring svg{width:64px;height:64px;transform:rotate(-90deg)}
.hero .ring circle{fill:none;stroke-width:7;stroke-linecap:round}
.hero .ring .bgc{stroke:rgba(255,255,255,.3)}
.hero .ring .fgc{stroke:#fff;transition:stroke-dashoffset 1s var(--ease)}
.hero .ring span{position:absolute;inset:0;display:grid;place-items:center;font-size:22px}
.hero .t1{font-size:22px;font-weight:700;letter-spacing:-.4px}
.hero .t2{font-size:14px;opacity:.9;margin-top:2px}

/* chips */
.chips{display:flex;gap:8px;overflow-x:auto;margin:0 -18px 14px;padding:2px 18px}
.chip{flex:none;padding:8px 14px;border-radius:20px;background:var(--card);font-size:14px;font-weight:500;box-shadow:var(--shadow);transition:background .25s,color .25s,transform .35s var(--spring)}
.chip.on{background:var(--txt);color:#fff}

/* list */
.list{display:flex;flex-direction:column;gap:10px}
.item{background:var(--card);border-radius:20px;box-shadow:var(--shadow);display:flex;align-items:center;gap:14px;padding:14px 14px 14px 14px;animation:itemIn .5s var(--spring) both}
@keyframes itemIn{from{opacity:0;transform:translateY(12px) scale(.98)}to{opacity:1;transform:none}}
.item.out{animation:itemOut .45s var(--ease) forwards}
@keyframes itemOut{to{opacity:0;transform:translateX(40px) scale(.95)}}
.emo{width:46px;height:46px;border-radius:14px;background:var(--soft);display:grid;place-items:center;font-size:24px;flex:none}
.item .mid{flex:1;min-width:0}
.item .tt{font-size:17px;font-weight:600;letter-spacing:-.2px;line-height:1.25}
.item .nn{font-size:13px;color:var(--mut);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.check{width:32px;height:32px;border-radius:50%;border:2px solid var(--dim);flex:none;display:grid;place-items:center;color:#fff;font-size:17px;transition:all .35s var(--spring)}
.check:active{transform:scale(.85);border-color:var(--pink)}
.check.on{background:var(--pink);border-color:var(--pink)}
.empty{text-align:center;color:var(--mut);padding:50px 20px;font-size:15px;line-height:1.5}
.empty .big{font-size:46px;margin-bottom:8px}

/* gallery */
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{background:var(--card);border-radius:20px;overflow:hidden;box-shadow:var(--shadow);animation:itemIn .5s var(--spring) both;text-align:left}
.tile .ph{aspect-ratio:1/1;background:var(--soft);display:grid;place-items:center;font-size:40px;position:relative;overflow:hidden}
.tile .ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .5s}
.tile .ph img.ld{opacity:1}
.tile .cap{padding:10px 12px 12px}
.tile .tt{font-size:15px;font-weight:600;line-height:1.25;letter-spacing:-.2px}
.tile .dd{font-size:12px;color:var(--mut);margin-top:3px}

/* tab bar */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:rgba(249,249,249,.86);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);border-top:.5px solid var(--line);padding:6px 0 calc(var(--safe-b) + 4px)}
nav.tabs .in{max-width:560px;margin:0 auto;display:flex;align-items:center;justify-content:space-around}
nav.tabs .tb{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10px;font-weight:500;color:var(--mut);padding:4px 0 2px;min-height:50px;transition:color .2s}
nav.tabs .tb svg.ic{font-size:26px;transition:transform .35s var(--spring)}
nav.tabs .tb:active svg.ic{transform:scale(.85)}
nav.tabs .tb.on{color:var(--pink)}
.fab{width:56px;height:56px;border-radius:50%;background:var(--pink);color:#fff;display:grid;place-items:center;font-size:28px;box-shadow:0 6px 18px rgba(255,55,95,.4);margin-top:-22px;transition:transform .4s var(--spring)}
.fab:active{transform:scale(.88)}

/* sheets */
.dim{position:fixed;inset:0;background:rgba(0,0,0,.28);z-index:40;opacity:0;pointer-events:none;transition:opacity .35s ease}
.dim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:50;background:var(--bg);border-radius:22px 22px 0 0;max-height:92%;overflow-y:auto;transform:translateY(105%);transition:transform .5s var(--ease);padding:8px 18px calc(var(--safe-b) + 20px);box-shadow:0 -8px 40px rgba(0,0,0,.12)}
.sheet.on{transform:none}
.sheet .in{max-width:560px;margin:0 auto}
.grab{width:38px;height:5px;border-radius:3px;background:var(--dim);margin:2px auto 12px}
.shead{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.shead h2{font-size:20px;font-weight:700;margin:0;letter-spacing:-.3px}
.shead .x{color:var(--pink);font-size:17px;padding:6px 2px;min-height:40px}
.field{background:var(--card);border-radius:14px;margin-bottom:12px;box-shadow:var(--shadow)}
.field input,.field textarea{width:100%;border:0;outline:0;background:transparent;font:inherit;font-size:17px;color:var(--txt);padding:14px 16px;border-radius:14px;resize:none}
.field textarea{min-height:76px}
.lbl{font-size:13px;color:var(--mut);margin:4px 6px 8px;text-transform:uppercase;letter-spacing:.3px}
.emojis{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
.emojis button{width:46px;height:46px;border-radius:14px;background:var(--card);font-size:23px;box-shadow:var(--shadow);transition:transform .35s var(--spring),background .2s,box-shadow .2s}
.emojis button.on{background:var(--soft);box-shadow:0 0 0 2px var(--pink)}
.btn{display:block;width:100%;background:var(--pink);color:#fff;font-size:17px;font-weight:600;border-radius:14px;padding:15px;min-height:52px;transition:transform .35s var(--spring),opacity .2s}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.5}
.btn.ghost{background:var(--card);color:var(--pink);box-shadow:var(--shadow);margin-top:10px}
.btn.danger{background:transparent;color:#ff3b30;box-shadow:none;margin-top:6px;font-weight:500}
.photo{background:var(--card);border-radius:18px;box-shadow:var(--shadow);aspect-ratio:4/3;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:var(--pink);font-size:15px;font-weight:500;margin-bottom:12px;position:relative;overflow:hidden;width:100%}
.photo svg.ic{font-size:34px}
.photo img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.photo input{position:absolute;inset:0;opacity:0}
.row{display:flex;align-items:center;justify-content:space-between;background:var(--card);border-radius:14px;padding:4px 6px 4px 16px;box-shadow:var(--shadow);margin-bottom:12px;font-size:17px;min-height:50px}
.row input{border:0;outline:0;background:var(--fill);border-radius:9px;padding:8px 10px;font:inherit;font-size:16px;color:var(--txt)}
.meta{color:var(--mut);font-size:13px;text-align:center;margin:12px 0 2px}
.detail-ph{border-radius:20px;overflow:hidden;background:var(--soft);aspect-ratio:4/5;display:grid;place-items:center;font-size:60px;margin-bottom:14px;position:relative;box-shadow:var(--shadow)}
.detail-ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.detail h3{font-size:24px;margin:0 0 4px;letter-spacing:-.4px}
.detail .when{color:var(--pink);font-weight:600;font-size:15px}
.detail p{color:#3a3a3c;font-size:16px;line-height:1.45;margin:10px 0 14px;white-space:pre-wrap}

/* lock */
.gate{position:fixed;inset:0;z-index:90;background:var(--bg);display:flex;justify-content:center;padding:calc(var(--safe-t) + 40px) 24px calc(var(--safe-b) + 24px);transition:opacity .5s ease,transform .5s var(--ease)}
.gate.gone{opacity:0;transform:scale(1.04);pointer-events:none}
.gate[hidden]{display:none}
.gate .in{width:100%;max-width:360px;display:flex;flex-direction:column;gap:12px;margin-top:8vh}
.gate .hrt{width:84px;height:84px;margin:0 auto 6px;border-radius:24px;background:linear-gradient(135deg,#ff5a7d,#ff8fa8);display:grid;place-items:center;color:#fff;font-size:42px;box-shadow:0 10px 28px rgba(255,55,95,.3);animation:beat 2.4s ease-in-out infinite}
@keyframes beat{0%,100%{transform:scale(1)}12%{transform:scale(1.07)}24%{transform:scale(1)}36%{transform:scale(1.05)}}
.gate h2{margin:0;text-align:center;font-size:28px;font-weight:700;letter-spacing:-.5px}
.gate .gsub{margin:0 0 10px;text-align:center;color:var(--mut);font-size:15px;line-height:1.4}
.gate .err{min-height:18px;color:#ff3b30;font-size:14px;text-align:center}
.gate .field{margin:0}
.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}

/* toast + hearts */
.toast{position:fixed;left:50%;top:calc(var(--safe-t) + 12px);transform:translate(-50%,-140%);background:rgba(28,28,30,.92);color:#fff;font-size:15px;font-weight:500;padding:11px 18px;border-radius:24px;z-index:95;transition:transform .5s var(--spring);white-space:nowrap;-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.toast.on{transform:translate(-50%,0)}
.hfx{position:fixed;z-index:96;pointer-events:none;font-size:22px;will-change:transform,opacity;animation:float 1.4s var(--ease) forwards}
@keyframes float{0%{opacity:0;transform:translate(0,0) scale(.4)}15%{opacity:1}100%{opacity:0;transform:translate(var(--dx),var(--dy)) scale(1.2) rotate(var(--r))}}
.hap{position:fixed;left:-100px;top:0;width:1px;height:1px;overflow:hidden;opacity:0}
</style>
</head>
<body>
<div class="scroller" id="scroller">
  <div class="wrap">
    <section class="view on" id="v-list">
      <div class="top"><h1>Our Bucket List</h1><div class="sync" id="sync"><i></i><span>Synced</span></div></div>
      <div class="top sub" id="sub" style="display:block;margin-top:2px"></div>
      <div class="hero"><div class="ring"><svg viewBox="0 0 64 64"><circle class="bgc" cx="32" cy="32" r="27"/><circle class="fgc" id="ring" cx="32" cy="32" r="27" stroke-dasharray="169.6" stroke-dashoffset="169.6"/></svg><span>❤️</span></div>
        <div><div class="t1" id="heroT">0 done together</div><div class="t2" id="heroS">Start with something small</div></div></div>
      <div class="chips" id="chips"></div>
      <div class="list" id="list"></div>
    </section>
    <section class="view" id="v-done">
      <div class="top"><h1>Done Together</h1></div>
      <div class="top sub" id="sub2" style="display:block;margin-top:2px"></div>
      <div class="grid" id="grid"></div>
    </section>
  </div>
</div>

<nav class="tabs"><div class="in">
  <button class="tb on" data-v="list" id="tabList"><i data-ic="list"></i>Ideas</button>
  <button class="fab" id="addBtn" aria-label="Add idea"><i data-ic="plus"></i></button>
  <button class="tb" data-v="done" id="tabDone"><i data-ic="heart"></i>Done</button>
</div></nav>

<div class="dim" id="dim"></div>

<!-- add / edit -->
<div class="sheet" id="sEdit"><div class="in">
  <div class="grab"></div>
  <div class="shead"><button class="x" data-close>Cancel</button><h2 id="eTitle">New idea</h2><span style="width:52px"></span></div>
  <div class="field"><input id="eName" placeholder="What do you want to do?" maxlength="80" autocomplete="off"></div>
  <div class="lbl">Type</div>
  <div class="emojis" id="eEmo"></div>
  <div class="field"><textarea id="eNote" placeholder="Notes (optional)" maxlength="300"></textarea></div>
  <button class="btn" id="eSave">Add to our list</button>
  <button class="btn danger" id="eDel" hidden>Delete idea</button>
  <div class="meta" id="eMeta"></div>
</div></div>

<!-- mark done -->
<div class="sheet" id="sDone"><div class="in">
  <div class="grab"></div>
  <div class="shead"><button class="x" data-close>Cancel</button><h2>We did it! 🎉</h2><span style="width:52px"></span></div>
  <div class="meta" id="dName" style="font-size:17px;color:var(--txt);font-weight:600;margin:0 0 14px"></div>
  <label class="photo" id="dPhoto"><i data-ic="camera"></i><span>Add a photo</span><input type="file" accept="image/*" id="dFile"></label>
  <div class="row"><span>Date</span><input type="date" id="dDate"></div>
  <div class="field"><textarea id="dNote" placeholder="How was it? (optional)" maxlength="400"></textarea></div>
  <button class="btn" id="dSave">Mark as done ❤️</button>
</div></div>

<!-- done detail -->
<div class="sheet" id="sView"><div class="in detail">
  <div class="grab"></div>
  <div class="shead"><span style="width:52px"></span><h2></h2><button class="x" data-close>Close</button></div>
  <div class="detail-ph" id="vPh"></div>
  <h3 id="vName"></h3><div class="when" id="vWhen"></div><p id="vNote"></p>
  <button class="btn ghost" id="vEdit">Edit photo &amp; note</button>
  <button class="btn danger" id="vUndo">Move back to ideas</button>
</div></div>

<!-- lock -->
<div class="gate" id="lock" hidden><div class="in" id="lockIn">
  <div class="hrt"><i data-ic="heart-fill"></i></div>
  <h2>Our Bucket List</h2>
  <p class="gsub" id="lockSub">Enter your shared passcode. You only need it once on this phone.</p>
  <div class="field"><input id="pw" type="password" placeholder="Passcode" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false" enterkeyhint="go"></div>
  <div class="field" id="nameF" hidden><input id="me" placeholder="Your first name" maxlength="20" autocomplete="off" enterkeyhint="done"></div>
  <div class="err" id="lockErr"></div>
  <button class="btn" id="lockBtn">Unlock</button>
</div></div>

<div class="toast" id="toast"></div>
<label class="hap" id="hap" aria-hidden="true"><input type="checkbox" switch tabindex="-1"></label>
<script src="app.js"></script>
</body>
</html>
