<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self' https://textdb.online; manifest-src 'self'; worker-src 'self'; font-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#f2f2f7">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Bucket List">
<meta name="format-detection" content="telephone=no">
<title>Our Bucket List</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/favicon-32.png">
<style>
:root{
  --bg:#f5f5f7; --card:#fff; --fill:#f0f0f3; --line:rgba(60,60,67,.1);
  --txt:#1c1c1e; --mut:#8e8e93; --dim:#d1d1d6; --pink:#ff375f; --soft:#fff1f4; --soft2:#ffe3ea;
  --shadow:0 1px 2px rgba(0,0,0,.04),0 6px 20px rgba(0,0,0,.05);
  --spring:cubic-bezier(.34,1.4,.64,1); --ease:cubic-bezier(.32,.72,0,1);
  --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px); --kb:0px;
}
[hidden]{display:none!important}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none;scrollbar-width:none}
::-webkit-scrollbar{display:none;width:0;height:0}
input,textarea{-webkit-user-select:text;user-select:text}
html,body{margin:0;height:100%;overflow:hidden;touch-action:manipulation;color:var(--txt);background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display",system-ui,"Helvetica Neue",sans-serif;-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%}
body{position:fixed;inset:0;overscroll-behavior:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;cursor:pointer}
.tap{transition:transform .4s var(--spring)}
.tap:active{transform:scale(.97);transition:transform .1s ease}
svg.ic{width:1em;height:1em;display:block;flex:none;pointer-events:none}

.scroller{position:absolute;inset:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:calc(var(--safe-t) + 14px) 0 calc(var(--safe-b) + 160px)}
.wrap{max-width:560px;margin:0 auto;padding:0 20px}
.view{display:none}.view.on{display:block;animation:viewIn .45s var(--ease)}
@keyframes viewIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.top{display:flex;align-items:center;justify-content:space-between;min-height:44px;margin:4px 0 2px}
.top h1{font-size:32px;font-weight:700;letter-spacing:-.8px;margin:0;line-height:1.1}
.sub{color:var(--mut);font-size:15px;margin:4px 0 22px;min-height:20px}
.sync{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--mut);opacity:0;transition:opacity .4s}
.sync.off{opacity:1}
.sync i{width:7px;height:7px;border-radius:50%;background:#ffcc00;display:block}
.sync.busy i{animation:pulse 1s infinite}
.sync.off i{background:var(--dim)}
@keyframes pulse{50%{opacity:.3}}

/* progress */
.prog{display:flex;align-items:center;gap:12px;margin:-8px 0 20px}
.bar{flex:1;height:6px;border-radius:3px;background:var(--soft2);overflow:hidden}
.bar i{display:block;height:100%;width:0;border-radius:3px;background:var(--pink);transition:width 1s var(--ease)}
.prog span{font-size:13px;font-weight:600;color:var(--pink);font-variant-numeric:tabular-nums}

/* list */
.list{display:flex;flex-direction:column;gap:10px}
.item{background:var(--card);border-radius:18px;box-shadow:var(--shadow);display:flex;align-items:center;gap:14px;padding:16px 14px 16px 16px;animation:itemIn .5s var(--spring) both;text-align:left;width:100%}
@keyframes itemIn{from{opacity:0;transform:translateY(10px) scale(.98)}to{opacity:1;transform:none}}
.item.out{animation:itemOut .5s var(--ease) forwards}
@keyframes itemOut{to{opacity:0;transform:scale(.92);height:0;margin:-5px 0;padding-top:0;padding-bottom:0}}
.item .emo{font-size:22px;width:28px;text-align:center;flex:none}
.item .mid{flex:1;min-width:0}
.item .tt{font-size:17px;font-weight:600;letter-spacing:-.2px;line-height:1.3}
.item .by{font-size:12px;color:var(--mut);margin-top:3px}
.check{width:30px;height:30px;border-radius:50%;border:2px solid var(--dim);flex:none;display:grid;place-items:center;color:#fff;font-size:16px;transition:all .35s var(--spring)}
.check.on{background:var(--pink);border-color:var(--pink);transform:scale(1.1)}

/* empty */
.hello{background:var(--card);border-radius:28px;box-shadow:var(--shadow);padding:40px 26px 28px;text-align:center;margin-top:6px;animation:itemIn .7s var(--spring) both}
.hello .hh{width:96px;height:96px;margin:0 auto 20px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ffd1dc,#ff8fa8 60%,#ff5a7d);display:grid;place-items:center;color:#fff;font-size:44px;box-shadow:0 12px 30px rgba(255,55,95,.28);animation:beat 2.6s ease-in-out infinite}
@keyframes beat{0%,100%{transform:scale(1)}12%{transform:scale(1.07)}24%{transform:scale(1)}36%{transform:scale(1.05)}}
.hello h2{margin:0 0 8px;font-size:24px;letter-spacing:-.5px}
.hello p{margin:0 0 24px;color:var(--mut);font-size:16px;line-height:1.45}
.soft-empty{text-align:center;color:var(--mut);padding:44px 24px;font-size:15px;line-height:1.5}
.soft-empty .big{font-size:40px;margin-bottom:10px}

/* memory wall */
.wall{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mem{position:relative;border-radius:22px;overflow:hidden;background:linear-gradient(160deg,var(--soft),var(--soft2));aspect-ratio:3/4;box-shadow:var(--shadow);animation:itemIn .55s var(--spring) both;text-align:left;display:block;width:100%}
.mem.hero{grid-column:1/-1;aspect-ratio:4/3}
.mem img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transform:scale(1.04);transition:opacity .6s ease,transform 1.2s var(--ease)}
.mem img.ld{opacity:1;transform:none}
.mem .cap{position:absolute;left:0;right:0;bottom:0;padding:34px 14px 12px;background:linear-gradient(transparent,rgba(0,0,0,.55));color:#fff}
.mem .tt{font-size:15px;font-weight:600;line-height:1.25;letter-spacing:-.2px;text-shadow:0 1px 6px rgba(0,0,0,.25)}
.mem.hero .tt{font-size:20px}
.mem .dd{font-size:12px;opacity:.85;margin-top:2px}
.mem .noph{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:var(--pink);font-size:13px;font-weight:600;padding-bottom:40px}
.mem .noph svg.ic{font-size:30px}
.mem.nophoto .cap{background:none;color:var(--txt)}
.mem.nophoto .tt{text-shadow:none}

/* tab bar */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:rgba(250,250,252,.86);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);border-top:.5px solid var(--line);padding:6px 0 calc(var(--safe-b) + 4px)}
nav.tabs .in{max-width:560px;margin:0 auto;display:flex;align-items:center;justify-content:space-around}
nav.tabs .tb{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10px;font-weight:500;color:var(--mut);padding:4px 0 2px;min-height:50px;transition:color .2s}
nav.tabs .tb svg.ic{font-size:25px;transition:transform .35s var(--spring)}
nav.tabs .tb:active svg.ic{transform:scale(.85)}
nav.tabs .tb.on{color:var(--pink)}
.fab{position:fixed;z-index:21;right:max(20px,calc(50% - 260px));bottom:calc(var(--safe-b) + 78px);width:58px;height:58px;border-radius:50%;background:var(--pink);color:#fff;display:grid;place-items:center;font-size:26px;box-shadow:0 8px 22px rgba(255,55,95,.4);transition:transform .45s var(--spring),opacity .3s}
.fab:active{transform:scale(.88)}
.fab.away{transform:scale(.4);opacity:0;pointer-events:none}
/* dates */
.dates{display:flex;flex-direction:column;gap:12px}
.dcard{background:var(--card);border-radius:22px;box-shadow:var(--shadow);padding:18px 20px;display:flex;align-items:center;gap:16px;animation:itemIn .55s var(--spring) both}
.dcard .de{width:52px;height:52px;border-radius:16px;background:var(--soft);display:grid;place-items:center;font-size:26px;flex:none}
.dcard .dm{flex:1;min-width:0}
.dcard .dn{font-size:17px;font-weight:600;letter-spacing:-.2px}
.dcard .dw{font-size:13px;color:var(--mut);margin-top:3px}
.dcard .dc{text-align:right}
.dcard .dc b{display:block;font-size:30px;font-weight:700;letter-spacing:-1px;line-height:1;color:var(--txt);font-variant-numeric:tabular-nums}
.dcard .dc small{font-size:12px;color:var(--mut)}
.dcard.first{background:linear-gradient(135deg,#ff5a7d,#ff8fa8);color:#fff;box-shadow:0 10px 28px rgba(255,55,95,.28);padding:24px 22px}
.dcard.first .de{background:rgba(255,255,255,.25)}
.dcard.first .dw,.dcard.first .dc small{color:rgba(255,255,255,.88)}
.dcard.first .dc b{color:#fff;font-size:40px}
.dcard.today .dc b{font-size:22px;letter-spacing:-.3px}

/* sheets */
.dim{position:fixed;inset:0;background:rgba(0,0,0,.25);z-index:40;opacity:0;pointer-events:none;transition:opacity .35s ease}
.dim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:var(--kb);z-index:50;background:var(--bg);border-radius:24px 24px 0 0;max-height:calc(94% - var(--kb));overflow-y:auto;transform:translateY(110%);transition:transform .5s var(--ease),bottom .25s ease;padding:8px 20px calc(var(--safe-b) + 18px);box-shadow:0 -10px 40px rgba(0,0,0,.12)}
.sheet.kbd{padding-bottom:14px}
.sheet.on{transform:none}
.sheet .in{max-width:560px;margin:0 auto}
.grab{width:36px;height:5px;border-radius:3px;background:var(--dim);margin:2px auto 10px}
.shead{display:flex;align-items:center;justify-content:space-between;min-height:44px;margin-bottom:10px}
.shead h2{font-size:17px;font-weight:600;margin:0}
.shead .x{color:var(--pink);font-size:17px;padding:8px 2px;min-width:60px;text-align:left}
.shead .x.r{text-align:right;font-weight:600}
.shead .x:disabled{color:var(--dim)}
.big-in{width:100%;border:0;outline:0;background:var(--card);border-radius:16px;font:inherit;font-size:20px;font-weight:600;letter-spacing:-.3px;color:var(--txt);padding:16px 18px;box-shadow:var(--shadow)}
.big-in::placeholder{color:#b8b8bd;font-weight:500}
.emos{display:flex;gap:6px;overflow-x:auto;margin:14px -20px 0;padding:2px 20px 4px}
.emos button{flex:none;width:44px;height:44px;border-radius:50%;background:var(--card);font-size:21px;box-shadow:var(--shadow);transition:transform .35s var(--spring),box-shadow .2s,background .2s}
.emos button.on{background:var(--soft);box-shadow:0 0 0 2px var(--pink)}
.note{width:100%;border:0;outline:0;background:var(--card);border-radius:14px;font:inherit;font-size:16px;color:var(--txt);padding:13px 16px;box-shadow:var(--shadow);resize:none;margin-top:12px;min-height:48px}
.btn{display:block;width:100%;background:var(--pink);color:#fff;font-size:17px;font-weight:600;border-radius:16px;padding:15px;min-height:54px;margin-top:16px;transition:transform .35s var(--spring),opacity .2s,background .3s}
.btn:active{transform:scale(.97)}
.btn.quiet{background:var(--card);color:var(--txt);box-shadow:var(--shadow)}
.link{display:block;margin:14px auto 0;color:#ff3b30;font-size:15px;padding:8px 14px}
.link.g{color:var(--mut)}
.meta{color:var(--mut);font-size:13px;text-align:center;margin-top:10px}

/* done sheet */
.d-title{text-align:center;font-size:22px;font-weight:700;letter-spacing:-.4px;margin:2px 10px 4px;line-height:1.25}
.d-by{text-align:center;color:var(--mut);font-size:13px;margin-bottom:16px}
.shot{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;width:100%;aspect-ratio:1/1;max-height:40vh;border-radius:24px;overflow:hidden;background:linear-gradient(160deg,var(--soft),var(--soft2));color:var(--pink);box-shadow:var(--shadow);transition:transform .4s var(--spring)}
.shot:active{transform:scale(.98)}
.shot .cam{width:68px;height:68px;border-radius:50%;background:#fff;display:grid;place-items:center;font-size:30px;box-shadow:0 6px 18px rgba(255,55,95,.18)}
.shot b{font-size:17px;font-weight:600}
.shot small{font-size:13px;color:#d27b90}
.shot img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;animation:fadeIn .5s ease}
@keyframes fadeIn{from{opacity:0;transform:scale(1.03)}to{opacity:1;transform:none}}
.shot input{position:absolute;inset:0;opacity:0;width:100%;height:100%}
.shot .chg{position:absolute;right:12px;top:12px;background:rgba(0,0,0,.45);color:#fff;font-size:13px;font-weight:600;padding:6px 12px;border-radius:16px;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);pointer-events:none}
.shot .spin{width:28px;height:28px;border-radius:50%;border:3px solid var(--soft2);border-top-color:var(--pink);animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.when{display:flex;justify-content:center;margin-top:14px}
.pill{position:relative;display:inline-flex;align-items:center;gap:6px;background:var(--card);border-radius:20px;padding:8px 14px;font-size:14px;font-weight:500;color:var(--txt);box-shadow:var(--shadow)}
.pill input{position:absolute;inset:0;opacity:0;width:100%}

/* memory detail */
.mv-ph{position:relative;border-radius:24px;overflow:hidden;aspect-ratio:4/5;max-height:58vh;width:100%;background:linear-gradient(160deg,var(--soft),var(--soft2));box-shadow:var(--shadow);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:var(--pink)}
.mv-ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;animation:fadeIn .5s ease}
.mv-ph input{position:absolute;inset:0;opacity:0;width:100%;height:100%}
.mv-ph .cam{width:64px;height:64px;border-radius:50%;background:#fff;display:grid;place-items:center;font-size:28px}
.mv-ph b{font-size:16px}
.mv h3{font-size:24px;margin:18px 0 4px;letter-spacing:-.5px;line-height:1.2}
.mv .dt{color:var(--pink);font-weight:600;font-size:14px}
.mv p{color:#3a3a3c;font-size:16px;line-height:1.45;margin:10px 0 0;white-space:pre-wrap}
.mv .acts{display:flex;gap:10px;margin-top:18px}
.mv .acts .btn{margin-top:0;font-size:15px;min-height:48px;padding:12px}

/* lock */
.gate{position:fixed;inset:0;z-index:90;background:var(--bg);display:flex;justify-content:center;padding:calc(var(--safe-t) + 40px) 24px calc(var(--safe-b) + 24px);transition:opacity .5s ease,transform .5s var(--ease)}
.gate.gone{opacity:0;transform:scale(1.04);pointer-events:none}
.gate .in{width:100%;max-width:360px;display:flex;flex-direction:column;gap:12px;margin-top:8vh}
.gate .hrt{width:84px;height:84px;margin:0 auto 8px;border-radius:24px;background:linear-gradient(135deg,#ff5a7d,#ff8fa8);display:grid;place-items:center;color:#fff;font-size:42px;box-shadow:0 10px 28px rgba(255,55,95,.3);animation:beat 2.6s ease-in-out infinite}
.gate h2{margin:0;text-align:center;font-size:28px;font-weight:700;letter-spacing:-.5px}
.gate .gsub{margin:0 0 10px;text-align:center;color:var(--mut);font-size:15px;line-height:1.4}
.gate .err{min-height:18px;color:#ff3b30;font-size:14px;text-align:center}
.gate input{width:100%;border:0;outline:0;background:var(--card);border-radius:14px;font:inherit;font-size:17px;color:var(--txt);padding:15px 16px;box-shadow:var(--shadow)}
.gate .btn{margin-top:4px}
.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}

.toast{position:fixed;left:50%;top:calc(var(--safe-t) + 12px);transform:translate(-50%,-160%);background:rgba(28,28,30,.9);color:#fff;font-size:15px;font-weight:500;padding:11px 18px;border-radius:24px;z-index:95;transition:transform .5s var(--spring);white-space:nowrap;-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.toast.on{transform:translate(-50%,0)}
.hfx{position:fixed;z-index:96;pointer-events:none;font-size:20px;will-change:transform,opacity;animation:float 1.5s var(--ease) forwards}
@keyframes float{0%{opacity:0;transform:translate(0,0) scale(.4)}15%{opacity:1}100%{opacity:0;transform:translate(var(--dx),var(--dy)) scale(1.15) rotate(var(--r))}}
.hap{position:fixed;left:-100px;top:0;width:1px;height:1px;overflow:hidden;opacity:0}
#kbProxy{position:fixed;top:0;left:0;width:1px;height:1px;opacity:0;border:0;padding:0;font-size:16px;pointer-events:none}
</style>
</head>
<body>
<div class="scroller" id="scroller">
  <div class="wrap">
    <section class="view on" id="v-list">
      <div class="top"><h1>Our Bucket List</h1><div class="sync" id="sync"><i></i><span></span></div></div>
      <div class="sub" id="sub"></div>
      <div class="prog" id="prog" hidden><div class="bar"><i id="barI"></i></div><span id="progT"></span></div>
      <div class="list" id="list"></div>
      <div class="hello" id="hello" hidden>
        <div class="hh"><i data-ic="heart-fill"></i></div>
        <h2>Dream up your first adventure</h2>
        <p>Write down the things you two want to do together. Tick them off with a photo of you doing it.</p>
        <button class="btn tap" id="firstBtn" style="margin-top:0">Add our first dream</button>
      </div>
    </section>
    <section class="view" id="v-dates">
      <div class="top"><h1>Our Dates</h1></div>
      <div class="sub">Counting down to our days</div>
      <div class="dates" id="dates"></div>
    </section>
    <section class="view" id="v-done">
      <div class="top"><h1>Done Together</h1></div>
      <div class="sub" id="sub2"></div>
      <div class="wall" id="wall"></div>
    </section>
  </div>
</div>

<button class="fab" id="addBtn" aria-label="Add a dream"><i data-ic="plus"></i></button>
<nav class="tabs"><div class="in">
  <button class="tb on" data-v="list" id="tabList"><i data-ic="list"></i>Our list</button>
  <button class="tb" data-v="done" id="tabDone"><i data-ic="heart"></i>Memories</button>
  <button class="tb" data-v="dates" id="tabDates"><i data-ic="cake"></i>Dates</button>
</div></nav>

<div class="dim" id="dim"></div>

<!-- add / edit -->
<div class="sheet" id="sEdit"><div class="in">
  <div class="grab"></div>
  <div class="shead"><button class="x" data-close>Cancel</button><h2 id="eTitle">New dream</h2><button class="x r" id="eSave" disabled>Add</button></div>
  <input class="big-in" id="eName" placeholder="Something to do together…" maxlength="80" autocomplete="off" enterkeyhint="done">
  <div class="emos" id="eEmo"></div>
  <textarea class="note" id="eNote" placeholder="Note (optional)" maxlength="300" rows="1" hidden></textarea>
  <button class="link" id="eDel" hidden>Delete</button>
</div></div>

<!-- complete -->
<div class="sheet" id="sDone"><div class="in">
  <div class="grab"></div>
  <div class="shead"><button class="x" data-close>Cancel</button><h2></h2><button class="x r" id="dEdit" style="font-weight:400">Edit</button></div>
  <div class="d-title" id="dName"></div>
  <div class="d-by" id="dBy"></div>
  <label class="shot" id="dShot"><span class="cam"><i data-ic="camera"></i></span><b>Add a photo of you two</b><small>Take one or pick from your library</small><input type="file" accept="image/*" id="dFile"></label>
  <div class="when"><span class="pill"><i data-ic="cal"></i><span id="dDateT"></span><input type="date" id="dDate"></span></div>
  <textarea class="note" id="dNote" placeholder="A little note (optional)" maxlength="400" rows="1"></textarea>
  <button class="btn" id="dSave">Save memory</button>
</div></div>

<!-- memory -->
<div class="sheet" id="sView"><div class="in mv">
  <div class="grab"></div>
  <div class="shead"><span style="min-width:60px"></span><h2></h2><button class="x r" data-close>Done</button></div>
  <label class="mv-ph" id="vPh"></label>
  <h3 id="vName"></h3><div class="dt" id="vWhen"></div><p id="vNote"></p>
  <div class="acts"><button class="btn quiet tap" id="vEdit">Edit</button></div>
  <button class="link g" id="vUndo">Move back to our list</button>
</div></div>

<!-- lock -->
<div class="gate" id="lock" hidden><div class="in" id="lockIn">
  <div class="hrt"><i data-ic="heart-fill"></i></div>
  <h2>Our Bucket List</h2>
  <p class="gsub" id="lockSub">Enter your shared passcode. You only need it once on this phone.</p>
  <input id="pw" type="password" placeholder="Passcode" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false" enterkeyhint="go">
  <input id="me" placeholder="Your first name" maxlength="20" autocomplete="off" enterkeyhint="done" hidden>
  <div class="err" id="lockErr"></div>
  <button class="btn" id="lockBtn">Unlock</button>
</div></div>
